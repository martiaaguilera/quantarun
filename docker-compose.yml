# Local QuantaRun stack: docker compose up --build
# Configuration comes from .env (copy .env.example). Nothing here requires a paid service or an API key.
name: quantarun

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${QUANTARUN_DB_NAME:-quantarun}
      POSTGRES_USER: ${QUANTARUN_DB_USER:?set QUANTARUN_DB_USER in .env}
      POSTGRES_PASSWORD: ${QUANTARUN_DB_PASSWORD:?set QUANTARUN_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${QUANTARUN_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: .
      dockerfile: infra/docker/java-app.Dockerfile
      args:
        APP_MODULE: control-plane
    environment:
      QUANTARUN_DB_URL: jdbc:postgresql://postgres:5432/${QUANTARUN_DB_NAME:-quantarun}
      QUANTARUN_DB_USER: ${QUANTARUN_DB_USER}
      QUANTARUN_DB_PASSWORD: ${QUANTARUN_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/java-app.Dockerfile
      args:
        APP_MODULE: worker
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  web:
    build:
      context: apps/web
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QUANTARUN_WEB_PORT:-3000}:80"

volumes:
  postgres-data:
