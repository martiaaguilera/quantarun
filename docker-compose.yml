# Local QuantaRun stack: docker compose up --build
# Configuration comes from .env (copy .env.example). Nothing here requires a paid service or an API key.
name: quantarun

x-worker-env: &worker-env
  QUANTARUN_CONTROL_PLANE_URL: http://control-plane:8080
  QUANTARUN_WORKER_BOOTSTRAP_TOKEN: ${QUANTARUN_WORKER_BOOTSTRAP_TOKEN}
  # Workers apply chaos faults only when started with this on (docs/CHAOS.md).
  QUANTARUN_WORKER_CHAOS_ENABLED: ${QUANTARUN_CHAOS_ENABLED:-false}

x-worker: &worker
  build:
    context: .
    dockerfile: infra/docker/java-app.Dockerfile
    args:
      APP_MODULE: worker
  image: quantarun-worker
  depends_on:
    control-plane:
      condition: service_healthy
  # Graceful stop lets the worker deregister; keep it above spring.lifecycle.timeout-per-shutdown-phase.
  stop_grace_period: 40s
  # A crashed worker (or one halted by the KILL_WORKER fault) comes back and registers as a new member, as it would
  # under any process supervisor. A deliberate `docker compose stop` exits cleanly and is not restarted.
  restart: on-failure
  healthcheck:
    # Readiness, not liveness: a worker counts as up only once it is registered with the control plane.
    test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${QUANTARUN_DB_NAME:-quantarun}
      POSTGRES_USER: ${QUANTARUN_DB_USER:?set QUANTARUN_DB_USER in .env}
      POSTGRES_PASSWORD: ${QUANTARUN_DB_PASSWORD:?set QUANTARUN_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${QUANTARUN_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: .
      dockerfile: infra/docker/java-app.Dockerfile
      args:
        APP_MODULE: control-plane
    environment:
      QUANTARUN_DB_URL: jdbc:postgresql://postgres:5432/${QUANTARUN_DB_NAME:-quantarun}
      QUANTARUN_DB_USER: ${QUANTARUN_DB_USER}
      QUANTARUN_DB_PASSWORD: ${QUANTARUN_DB_PASSWORD}
      QUANTARUN_ADMIN_TOKEN: ${QUANTARUN_ADMIN_TOKEN:?set QUANTARUN_ADMIN_TOKEN in .env}
      QUANTARUN_WORKER_BOOTSTRAP_TOKEN: ${QUANTARUN_WORKER_BOOTSTRAP_TOKEN:?set QUANTARUN_WORKER_BOOTSTRAP_TOKEN in .env}
      # FIFO, PRIORITY, LEAST_LOADED, BIN_PACKING, FAIR_SHARE or DEADLINE (docs/SPEC.md §7, docs/SCHEDULER.md).
      QUANTARUN_SCHEDULER_POLICY: ${QUANTARUN_SCHEDULER_POLICY:-BIN_PACKING}
      # Predefined fault injection through /api/v1/chaos; off unless asked for (docs/CHAOS.md).
      QUANTARUN_CHAOS_ENABLED: ${QUANTARUN_CHAOS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  # Three deliberately different workers so placement decisions are visible. Accelerators are simulated slots.
  worker-cpu:
    <<: *worker
    environment:
      <<: *worker-env
      QUANTARUN_WORKER_NAME: worker-cpu
      QUANTARUN_WORKER_CPU_MILLIS: 4000
      QUANTARUN_WORKER_MEMORY_MIB: 8192
      QUANTARUN_WORKER_ACCELERATORS: 0
      QUANTARUN_WORKER_SLOTS: 4
      QUANTARUN_WORKER_LABELS: ""

  worker-mixed:
    <<: *worker
    environment:
      <<: *worker-env
      QUANTARUN_WORKER_NAME: worker-mixed
      QUANTARUN_WORKER_CPU_MILLIS: 8000
      QUANTARUN_WORKER_MEMORY_MIB: 16384
      QUANTARUN_WORKER_ACCELERATORS: 1
      QUANTARUN_WORKER_SLOTS: 4
      QUANTARUN_WORKER_LABELS: cuda

  worker-accel:
    <<: *worker
    environment:
      <<: *worker-env
      QUANTARUN_WORKER_NAME: worker-accel
      QUANTARUN_WORKER_CPU_MILLIS: 8000
      QUANTARUN_WORKER_MEMORY_MIB: 32768
      QUANTARUN_WORKER_ACCELERATORS: 2
      QUANTARUN_WORKER_SLOTS: 2
      QUANTARUN_WORKER_LABELS: cuda,large-model

  web:
    build:
      context: apps/web
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QUANTARUN_WEB_PORT:-3000}:80"

volumes:
  postgres-data:
