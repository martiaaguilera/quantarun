server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers (Phase 14). The console is a same-origin SPA with no inline script, no third-party
    # resources and no reason to be framed, so the policy can be strict. React sets styles through the DOM, which
    # style-src does not restrict. Repeated in /assets/ below: a location with its own add_header drops these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same-origin proxy: the browser only ever talks to this server, so the control plane needs no CORS setup.
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events must not be buffered, or updates arrive in bursts instead of as they happen.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /actuator/health {
        proxy_pass http://control-plane:8080;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Client-side routing: unknown paths return the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
