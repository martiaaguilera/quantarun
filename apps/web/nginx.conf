server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Same-origin proxy: the browser only ever talks to this server, so the control plane needs no CORS setup.
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events must not be buffered, or updates arrive in bursts instead of as they happen.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /actuator/health {
        proxy_pass http://control-plane:8080;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing: unknown paths return the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
