quantarun:
  security:
    admin-token: test-admin-token-0123456789abcdef0123
  workers:
    bootstrap-token: test-worker-bootstrap-token-0123456789
    liveness-monitor-enabled: false
    startup-grace: 0s
  reliability:
    lease-reaper-enabled: false
  scheduler:
    # Tests drive SchedulingCycle directly; background loops would race them.
    enabled: false
  events:
    # Tests drive JobEventStream.poll() themselves.
    poll-enabled: false
  metrics:
    # Tests refresh the gauges when they assert on them; a background refresh would race TRUNCATE.
    gauges-enabled: false
  chaos:
    # Experiments exist only when a test creates one; ChaosExperimentsTest covers the disabled deployment.
    enabled: true
