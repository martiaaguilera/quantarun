spring:
  application:
    name: quantarun-control-plane
  datasource:
    # No defaults for credentials: a missing variable must fail startup rather than silently use a guess.
    url: ${QUANTARUN_DB_URL}
    username: ${QUANTARUN_DB_USER}
    password: ${QUANTARUN_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${QUANTARUN_DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

quantarun:
  security:
    # Operator credential; required, at least 32 characters (see SecurityProperties).
    admin-token: ${QUANTARUN_ADMIN_TOKEN}
  api:
    max-request-body: 64KB
  workers:
    # Shared secret workers present only to register (min. 32 chars); later calls use per-worker credentials.
    bootstrap-token: ${QUANTARUN_WORKER_BOOTSTRAP_TOKEN}

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  # Traces are exported only when management.opentelemetry.tracing.export.otlp.endpoint is set, which
  # docker-compose.observability.yml does. Metrics are scraped by Prometheus; OTLP metrics and logs stay opt-in, so a
  # node without a collector does not log connection errors.
  otlp:
    metrics:
      export:
        enabled: ${QUANTARUN_OTLP_ENABLED:false}
    logging:
      export:
        enabled: ${QUANTARUN_OTLP_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
